```yaml
openapi: 3.0.0
info:
  title: AI News Podcast API
  version: 1.0.0
  description: API documentation for the AI News Podcast application
  termsOfService: http://example.com/terms/
  contact:
    name: Support Team
    url: http://example.com/support
    email: support@example.com
  license:
    name: MIT
    url: http://opensource.org/licenses/MIT
servers:
  - url: http://api.example.com/v1

paths:
  /users:
    get:
      summary: Retrieve a list of users
      security:
        - OAuth2: [read:users]
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      summary: Create a new user
      security:
        - OAuth2: [write:users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
        '409':
          description: Conflict (User already exists)

  /users/{userId}:
    get:
      summary: Retrieve a single user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      security:
        - OAuth2: [read:users]
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  /podcasts:
    get:
      summary: Retrieve a list of podcasts
      security:
        - OAuth2: [read:podcasts]
      responses:
        '200':
          description: A list of podcasts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Podcast'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      summary: Create a new podcast
      security:
        - OAuth2: [write:podcasts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PodcastCreate'
      responses:
        '201':
          description: Podcast created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Podcast'
        '400':
          description: Bad Request

  /feedback:
    post:
      summary: Submit feedback for a podcast
      security:
        - OAuth2: [write:feedback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      responses:
        '201':
          description: Feedback submitted successfully
        '400':
          description: Bad Request

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
   
    UserCreate:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - username
        - email
        - password

    Podcast:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time

    PodcastCreate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
      required:
        - title

    FeedbackCreate:
      type: object
      properties:
        user_id:
          type: string
        podcast_id:
          type: string
        rating:
          type: integer
          format: int8
        comment:
          type: string
      required:
        - user_id
        - podcast_id
        - rating

securitySchemes:
  OAuth2:
    type: oauth2
    flows:
      authorizationCode:
        authorizationUrl: http://example.com/oauth/authorize
        tokenUrl: http://example.com/oauth/token
        scopes:
          read:users: Read user information
          write:users: Modify user information
          read:podcasts: Read podcast information
          write:podcasts: Create or modify podcasts
          write:feedback: Submit feedback

tags:
  - name: users
    description: Operations related to users
  - name: podcasts
    description: Operations related to podcasts
  - name: feedback
    description: Submit feedback regarding podcasts
```